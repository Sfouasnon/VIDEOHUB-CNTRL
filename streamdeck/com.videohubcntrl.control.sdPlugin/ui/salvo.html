<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="stylesheet" href="pi.css" />
		<script src="sd-pi.js"></script>
	</head>
	<body>
		<div class="status" id="status"><span class="dot"></span><span id="status-text">Connecting…</span></div>

		<h2>Salvo</h2>
		<div class="row">
			<label class="field" for="salvo">Salvo</label>
			<select id="salvo"></select>
		</div>
		<div class="row">
			<label class="field" for="title">Label</label>
			<input type="text" id="title" placeholder="Auto from salvo name" />
		</div>
		<p class="hint" id="summary">
			Salvos are created in the Videohub CNTRL app and are stored per router. Editing a salvo there updates
			every key bound to it.
		</p>

		<script>
			(function () {
				let settings = {};
				let snapshot = null;
				let connected = false;

				const statusEl = document.getElementById("status");
				const statusTextEl = document.getElementById("status-text");
				const salvoEl = document.getElementById("salvo");
				const titleEl = document.getElementById("title");
				const summaryEl = document.getElementById("summary");

				function escapeHTML(value) {
					return String(value).replace(/[&<>"]/g, function (character) {
						return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[character];
					});
				}

				function render() {
					statusEl.className = "status " + (connected ? "online" : "offline");
					statusTextEl.textContent = connected
						? snapshot
							? snapshot.router.name + " (" + snapshot.connection + ")"
							: "Connected to Videohub CNTRL"
						: "Videohub CNTRL is not running";

					const salvos = snapshot ? snapshot.salvos : [];
					if (salvos.length === 0) {
						salvoEl.innerHTML =
							'<option value="">' +
							(connected ? "No salvos on this router" : "Start the app to list salvos") +
							"</option>";
					} else {
						salvoEl.innerHTML = salvos
							.map(function (salvo) {
								return (
									'<option value="' +
									escapeHTML(salvo.id) +
									'"' +
									(salvo.id === settings.salvoID ? " selected" : "") +
									">" +
									escapeHTML(salvo.name) +
									" (" +
									salvo.crosspoints.length +
									")</option>"
								);
							})
							.join("");
					}

					if (document.activeElement !== titleEl) {
						titleEl.value = settings.title || "";
					}

					const selected = salvos.filter(function (salvo) {
						return salvo.id === settings.salvoID;
					})[0];
					summaryEl.textContent = selected
						? selected.name + " moves " + selected.crosspoints.length + " crosspoints."
						: "Salvos are created in the Videohub CNTRL app and are stored per router. Editing a salvo there updates every key bound to it.";
				}

				function commit(next) {
					settings = Object.assign({}, settings, next);
					window.sdpi.setSettings(settings);
					render();
				}

				salvoEl.addEventListener("change", function () {
					commit({ salvoID: salvoEl.value });
				});

				titleEl.addEventListener("input", function () {
					commit({ title: titleEl.value });
				});

				window.sdpi.onSettings(function (value) {
					settings = value || {};
					render();
				});

				window.sdpi.onPluginMessage(function (message) {
					if (message.event === "snapshot") {
						snapshot = message.snapshot || null;
						connected = message.connected === true;
						render();
					}
				});

				render();
			})();
		</script>
	</body>
</html>
